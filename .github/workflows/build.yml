name: build

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ g++-mingw-w64-x86-64 nsis zip

      - name: Test
        run: ./tests/run_tests.sh

      - name: Package
        run: ./scripts/build.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: EasyQR-1.4.3-x64
          path: |
            dist/EasyQR.exe
            dist/EasyQR-1.4.3-x64-portable.zip
            dist/EasyQR-1.4.3-x64-setup.exe
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: EasyQR-1.4.3-x64
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "EasyQR ${TAG#v}" \
              --generate-notes
          fi
