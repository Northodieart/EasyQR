name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ g++-mingw-w64-x86-64 nsis zip

      - name: Test
        run: ./tests/run_tests.sh

      - name: Package
        run: ./scripts/build.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: EasyQR-1.0.0-x64
          path: |
            dist/EasyQR.exe
            dist/EasyQR-1.0.0-x64-portable.zip
            dist/EasyQR-1.0.0-x64-setup.exe
            dist/SHA256SUMS.txt
